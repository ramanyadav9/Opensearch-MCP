[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-mcp"
version = "0.1.0"
description = "Python MCP Server for Sentinel-AI SIEM"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Sentinel-AI Team"}
]
dependencies = [
    "mcp>=0.9.0",
    "opensearch-py>=2.4.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sentinel-mcp = "sentinel_mcp.server:main"
